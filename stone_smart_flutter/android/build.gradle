group 'com.qztech.stone_smart_flutter'
version '1.0'

buildscript {
    ext {
        kotlin_version = '1.9.0'

        localProp = new Properties()
        fileName = 'local.properties'
        if (project.rootProject.file(fileName).exists()) {
            localProp.load(new FileInputStream(rootProject.file(fileName)))
        }

        // MCPARK — versao da SDK nativa da Stone, agora PARAMETRIZAVEL.
        //
        // Era fixa em 4.10.2 (12/09/2024). A Stone ja esta na 4.15.0
        // (01/07/2026) e o SDK tem o erro SDK_VERSION_IS_OUTDATED, ou seja,
        // versoes antigas podem ser RECUSADAS na ativacao/transacao.
        // Deixar isto configuravel permite subir/voltar a versao sem novo fork:
        //   - env STONE_SDK_VERSION, ou
        //   - stoneSdkVersion=... em local.properties
        stone_sdk_version = System.env.STONE_SDK_VERSION != null
            ? System.env.STONE_SDK_VERSION
            : (localProp["stoneSdkVersion"] ?: '4.15.0')

        // MCPARK — o token INTERNAL nao tinha fallback: ausente, a URL do Maven
        // virava literalmente ".../priv/null/...". Agora cai em vazio, igual ao
        // token principal, e o erro fica compreensivel.
        packageCloudReadToken = System.env.PACKAGECLOUD_READ_TOKEN != null ? System.env.PACKAGECLOUD_READ_TOKEN  : localProp["packageCloudReadToken"] ?: ""
        packageCloudReadTokenInternal = System.env.PACKAGECLOUD_READ_TOKEN_INTERNAL != null ? System.env.PACKAGECLOUD_READ_TOKEN_INTERNAL : localProp["packageCloudReadTokenInternal"] ?: ""
        println "stone_sdk_version: $stone_sdk_version"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://packagecloud.io/priv/${packageCloudReadToken}/stone/pos-android/maven2" }
        maven { url "https://packagecloud.io/priv/${packageCloudReadTokenInternal}/stone/pos-android-internal/maven2" }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = "com.qztech.stone_smart_flutter"

    compileSdk = 35

    // MCPARK — `lintOptions` foi REMOVIDO no AGP 8; o app consumidor usa AGP
    // 8.11. Trocado pelo bloco `lint`, valido de AGP 7.1 em diante.
    lint {
        disable 'InvalidPackage'
    }

    // MCPARK — Java 17. A SDK da Stone exige Java 17 a partir da v4.11.1
    // (junto com Kotlin 1.9.0, Gradle 7.3.3 e AGP 7.2.0). Com Java 11 aqui, o
    // modulo nao linka com as versoes atuais da SDK.
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    packagingOptions {
        exclude 'META-INF/api_release.kotlin_module'
        exclude 'META-INF/client_release.kotlin_module'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
       minSdk = 22
    }
}

dependencies{
    implementation "br.com.stone:stone-sdk:$stone_sdk_version"
    implementation "br.com.stone:stone-sdk-posandroid:$stone_sdk_version"
    implementation "br.com.stone:stone-sdk-posandroid-positivo:$stone_sdk_version"

    implementation "br.com.stone:stone-sdk-posandroid-ingenico:$stone_sdk_version"
    implementation "br.com.stone:stone-sdk-posandroid-sunmi:$stone_sdk_version"
    implementation "br.com.stone:stone-sdk-posandroid-gertec:$stone_sdk_version"

    // debugImplementation "com.github.tony19:logback-android:2.0.0"
    // debugImplementation 'br.com.stone.sdk.android:debugmode:4.0.3'
}
