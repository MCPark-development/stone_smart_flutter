group 'br.com.mcpark.stone_smart'
version '1.0'

buildscript {
    ext {
        kotlin_version = '1.9.0'

        localProp = new Properties()
        fileName = 'local.properties'
        if (project.rootProject.file(fileName).exists()) {
            localProp.load(new FileInputStream(rootProject.file(fileName)))
        }

        // MCPARK — versao da SDK nativa da Stone, agora PARAMETRIZAVEL.
        //
        // Era fixa em 4.10.2 (12/09/2024). A Stone ja esta na 4.15.0
        // (01/07/2026) e o SDK tem o erro SDK_VERSION_IS_OUTDATED, ou seja,
        // versoes antigas podem ser RECUSADAS na ativacao/transacao.
        // Deixar isto configuravel permite subir/voltar a versao sem novo fork:
        //   - env STONE_SDK_VERSION, ou
        //   - stoneSdkVersion=... em local.properties
        // Default 4.16.3: e a versao usada pelo DEMO OFICIAL da Stone
        // (github.com/stone-payments/demo-sdk-android), portanto a unica em que
        // se sabe que os SEIS artefatos de fabricante existem publicados juntos.
        // A 4.15.0 e a ultima com changelog publico, mas basta um dos artefatos
        // nao ter sido publicado nela para o build travar.
        //
        // Compara com trim(): variavel de ambiente VAZIA nao e null. Se o CI
        // exportar STONE_SDK_VERSION sem valor (repo variable inexistente), o
        // ternario antigo escolhia "" e a dependencia saia SEM versao
        // ("br.com.stone:stone-sdk:"), com erro incompreensivel.
        def envSdkVersion = System.env.STONE_SDK_VERSION?.trim()
        def localSdkVersion = localProp["stoneSdkVersion"]?.toString()?.trim()
        stone_sdk_version = envSdkVersion ?: (localSdkVersion ?: '4.16.3')

        // MCPARK — o token INTERNAL nao tinha fallback: ausente, a URL do Maven
        // virava literalmente ".../priv/null/...". Agora cai em vazio, igual ao
        // token principal, e o erro fica compreensivel.
        packageCloudReadToken = System.env.PACKAGECLOUD_READ_TOKEN != null ? System.env.PACKAGECLOUD_READ_TOKEN  : localProp["packageCloudReadToken"] ?: ""
        packageCloudReadTokenInternal = System.env.PACKAGECLOUD_READ_TOKEN_INTERNAL != null ? System.env.PACKAGECLOUD_READ_TOKEN_INTERNAL : localProp["packageCloudReadTokenInternal"] ?: ""
        println "stone_sdk_version: $stone_sdk_version"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://packagecloud.io/priv/${packageCloudReadToken}/stone/pos-android/maven2" }
        maven { url "https://packagecloud.io/priv/${packageCloudReadTokenInternal}/stone/pos-android-internal/maven2" }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = "br.com.mcpark.stone_smart"

    // 36: a AAR da Stone 4.15+ pode declarar minCompileSdk 36 e o merge falha com
    // "requires libraries and applications that depend on it to compile against
    // version 36 or later". O app ja compila em 36 (flutter.compileSdkVersion),
    // entao alinhar aqui e custo zero.
    compileSdk = 36

    // MCPARK — `lint` e a forma atual (valida de AGP 7.1 em diante).
    // CORRECAO DE REGISTRO: o commit que fez esta troca alegou que
    // `lintOptions` teria sido REMOVIDO no AGP 8. Isso e FALSO — a auditoria
    // verificou por javap que `LibraryExtension.getLintOptions()` continua
    // existindo no AGP 8.11.1. A troca nao regride nada e moderniza, mas a
    // justificativa original estava errada.
    lint {
        disable 'InvalidPackage'
    }

    // MCPARK — Java 17. A SDK da Stone exige Java 17 a partir da v4.11.1
    // (junto com Kotlin 1.9.0, Gradle 7.3.3 e AGP 7.2.0). Com Java 11 aqui, o
    // modulo nao linka com as versoes atuais da SDK.
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    packagingOptions {
        exclude 'META-INF/api_release.kotlin_module'
        exclude 'META-INF/client_release.kotlin_module'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
       // 24 (Android 7): alinhado ao app. Com 22, se a AAR da Stone declarar
       // minSdk 24 o merge de manifesto FALHA ("uses-sdk:minSdkVersion 22
       // cannot be smaller than version 24 declared in library").
       minSdk = 24
    }
}

dependencies{
    implementation "br.com.stone:stone-sdk:$stone_sdk_version"
    implementation "br.com.stone:stone-sdk-posandroid:$stone_sdk_version"
    implementation "br.com.stone:stone-sdk-posandroid-positivo:$stone_sdk_version"

    implementation "br.com.stone:stone-sdk-posandroid-ingenico:$stone_sdk_version"
    implementation "br.com.stone:stone-sdk-posandroid-sunmi:$stone_sdk_version"
    implementation "br.com.stone:stone-sdk-posandroid-gertec:$stone_sdk_version"

    // debugImplementation "com.github.tony19:logback-android:2.0.0"
    // debugImplementation 'br.com.stone.sdk.android:debugmode:4.0.3'
}
